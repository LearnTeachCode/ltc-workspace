---
# List of plays
-
  # Hosts: where our play will run and options it will run with
  hosts: localhost
  connection: local
  gather_facts: yes
  tags: always

  # Vars: variables that will apply to the play, on all targets 

  # Tasks: the list of tasks that will be executed within 
  #        the play, this section can also be used for 
  #        pre and post tasks
  tasks:
    # from https://superuser.com/questions/1395954/ansible-playbook-to-determine-os-release
  - name: System details
    debug: msg="{{ item }}"
    with_items: 
    - "{{ ansible_distribution }}"
    - "{{ ansible_distribution_version }}"
    - "{{ ansible_distribution_major_version }}"
    # Detect if we are running on a WSL2 environment
  - name: Verify install_files is present
    debug: msg="install_files/_README = {{ lookup('file', '/home/kasm-default-profile/install_files/_README') }}"
    # Detect if we are running on a WSL2 environment
  - name: Set wsl2_environment fact default to false
    set_fact:
      wsl2_environment: false
  - name: Set wsl2_environment fact True
    set_fact:
      wsl2_environment: true
    when: ansible_kernel is search("microsoft-standard-WSL2")  
  # fix for .gnupg/ permissions when building custom images
  - name: Add fix for .gnupg/ permissions
    lineinfile:
      path: "/etc/bash.bashrc"
      line: "chmod 700 ~/.gnupg/"    
  - name: Add custom prompt to /etc/skel/.profile
    lineinfile:
      path: "/etc/skel/.profile"
      line: 'export PS1="\[\033[00;32m\][\w]\$\[\033[00m\] "'
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

  # Handlers: the list of handlers that are executed as a notify 
  #           key from a task

  # Roles: list of roles to be imported into the play
  roles:
  - role: irixjp.role_example_hello

# Add additional plays here (remember the list entry -)
# Be sure to use the same hosts and connection entries above
# addtional plays

-
  # install chrome
  hosts: localhost
  connection: local
  gather_facts: yes
  tags:
    - install_chrome

  tasks:
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

  roles:
    - role: webarchitect609.google_chrome

-
# add dev user to give vs code somewhere to install extensions
  hosts: localhost
  connection: local
  tags:
    - install_utilities
    - install_vscode

  tasks:
  - name: Add dev user
    user:
      name: dev
      uid: 1002
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

-
  # install keychain, git, nix, and @capsulecorplab .vimrc and .gitconfig
  hosts: localhost
  connection: local
  gather_facts: yes
  tags:
    - install_utilities
    - install_python_packages
    - install_vscode

  vars:
    nixos_release: "26.05"
    nix_version: "2.35.3"
    nix_bin_dir: /nix/var/nix/profiles/default/bin
    nix_bin_path: "{{ nix_bin_dir }}/nix"
    nix_install_dir: /home/kasm-default-profile/install_files/
    nix_installer_dir: "{{ nix_install_dir }}/nix-{{ nix_version }}-x86_64-linux"
    git_version: "2.54.0"
    keychain_version: "2.9.8"
    keychain_version_expected: "{{ keychain_version }}."

  tasks:
  - name: Download nix tarball {{ nix_version }}
    shell: curl -L https://releases.nixos.org/nix/nix-{{ nix_version }}/nix-{{ nix_version }}-x86\_64-linux.tar.xz -o {{ nix_installer_dir }}.tar.xz
  - name: Extract nix tarball to {{ nix_install_dir }}
    shell:
      cmd: "tar -xvf {{ nix_installer_dir }}.tar.xz"
      chdir: "{{ nix_install_dir }}"
      executable: /bin/bash
    args:
      creates: "{{ nix_installer_dir }}/install"
  - name: Create nix build users group # workaround to shut up installer from complaining about no nixbld group 
    shell: groupadd nixbld
  - name: Add dev to nixbld group # workaround to shut up installer from complaining about no user in nixbld group
    shell: usermod -aG nixbld dev
  - name: Unset LD_LIBRARY_PATH system-wide
    shell: printf "\nunset LD_LIBRARY_PATH\n" >> /etc/profile && . /etc/profile
  - name: Install (single-user) nix using classic nix installer with --yes (run install script non-interactively)
    shell:
      cmd: ./install --no-daemon --yes
      chdir: "{{ nix_installer_dir }}"
      executable: /bin/bash
    environment:
      LD_LIBRARY_PATH: ""
  - name: Add {{ nix_bin_dir }} to PATH system-wide
    shell: printf "\nexport PATH="{{ nix_bin_dir }}:$PATH"\n" >> /etc/profile && . /etc/profile
  - name: Install git {{ git_version }} with nix
    shell: "{{ nix_bin_path }} profile install nixpkgs/release-{{ nixos_release }}#git --extra-experimental-features 'nix-command flakes'"
    environment:
      LD_LIBRARY_PATH: ""
  - name: Install Git Bash Completion
    shell: "{{ nix_bin_path }} profile install nixpkgs/release-{{ nixos_release }}#bash-completion --extra-experimental-features 'nix-command flakes'"
    environment:
      LD_LIBRARY_PATH: ""
  - name: Install Keychain
    shell: "{{ nix_bin_path }} profile install nixpkgs/release-{{ nixos_release }}#keychain --extra-experimental-features 'nix-command flakes'"
    environment:
      LD_LIBRARY_PATH: ""
  - name: install ping
    shell: "{{ nix_bin_path }} profile install nixpkgs#unixtools.ping --extra-experimental-features 'nix-command flakes'"
    environment:
      LD_LIBRARY_PATH: ""
  - name: Get keychain version
    shell:
      cmd: "{{ nix_bin_dir }}/keychain -V 2> >(grep -i keychain) 2> >(sed 's/[[:alpha:]|(|[:space:]]//g') | fgrep '*' | sed 's/[*~://]//g'"
      executable: /bin/bash
    register: installed_keychain_version
    environment:
      LD_LIBRARY_PATH: ""
  - name: Get git version
    shell: "{{ nix_bin_dir }}/git version | sed 's/[[:alpha:]|(|[:space:]]//g'"
    register: installed_git_version
    environment:
      LD_LIBRARY_PATH: ""
  - name: Display git and keychain versions
    debug:
      msg: "git = {{ installed_git_version.stdout }} | keychain = {{ installed_keychain_version.stdout }}"
  - name: Test git version
    fail:
      msg: "Git Version Error: Expected {{ git_version }} | Found {{ installed_git_version.stdout }}"
    when: installed_git_version.stdout != git_version
  - name: Test keychain version
    fail:
      msg: "Keychain Version Error: Expected {{ keychain_version_expected }} | Found {{ installed_keychain_version.stdout }}"
    when: installed_keychain_version.stdout != keychain_version_expected
  - name: Install @capsulecorplab .vimrc
    get_url:
      url: https://gist.githubusercontent.com/capsulecorplab/495058e7a57ed8adaed3c40c80d09739/raw/4a6e6f6ff92b96919be111c9cbb5a4a21ab472d2/.vimrc
      dest: /home/kasm-default-profile/
  - name: Install @capsulecorplab .gitconfig
    get_url:
      url: https://gist.githubusercontent.com/capsulecorplab/401ba2fe0857a328f2a626adbf078cc6/raw/b89a6234f0d620ff60bcfe37f95de197b8772377/.gitconfig
      dest: /home/kasm-default-profile/
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

-
  # install sudo for the vs-code role below
  hosts: localhost
  connection: local
  tags:
    - install_vscode

  vars:
    nixos_release: "26.05"
    nix_version: "2.35.3"
    nix_bin_dir: /nix/var/nix/profiles/default/bin
    nix_bin_path: "{{ nix_bin_dir }}/nix"

  tasks:
  - name: Install sudo
    shell: "{{ nix_bin_path }} profile install nixpkgs/release-{{ nixos_release }}#sudo --extra-experimental-features 'nix-command flakes'"
    environment:
      LD_LIBRARY_PATH: ""
  - name: Preserve DONT_PROMPT_WSL_INSTALL in sudoers
    lineinfile:
      path: "/etc/sudoers"
      line: "Defaults        env_keep += \"DONT_PROMPT_WSL_INSTALL\""
    when: wsl2_environment
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

-
  # install VS Code
  hosts: localhost
  connection: local
  tags:
    - install_vscode

  environment:
    DONT_PROMPT_WSL_INSTALL: 1

  tasks:
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

  roles:
    - role: gantsign.visual-studio-code
      visual_studio_code_version: "1.91.1*"
      users:
        - username: "dev"
          visual_studio_code_extensions:
            - ms-python.python
            - dendron.dendron
            #- foam.foam-vscode
          visual_studio_code_settings_overwrite: yes
          visual_studio_code_settings: {
            "extensions.ignoreRecommendations": true,
            "update.mode": "none",
            "extensions.autoUpdate": false,
            "extensions.autoCheckUpdates": false,
            "terminal.integrated.profiles.linux": {
              "bash (login)": {
                "path": "bash",
                "args": ["-l"]
                }
              },
            "terminal.integrated.defaultProfile.linux": "bash (login)"
          }

-
  # Copy VS Code changes to kasm-default-profile
  hosts: localhost
  connection: local
  tags:
    - install_vscode

  tasks:
  - name: Copy VS Code changes to kasm-default-profile
    shell:
      cmd: cp -r /home/dev/.config/Code/ /home/kasm-default-profile/.config/Code/ && cp -r /home/dev/.vscode/ /home/kasm-default-profile/.vscode/
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

-
  # Clean up (remove) dev user now that things are installed
  hosts: localhost
  connection: local
  tags:
    - install_vscode

  tasks:
  - name: Remove dev user
    user:
      name: dev
      state: absent
      remove: yes
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

-
  # install Python packages with pip
  hosts: localhost
  connection: local
  gather_facts: yes
  tags:
  - install_python_packages

  tasks:
  - name: Update OS to point python to python3
    apt:
      name: python-is-python3
      update_cache: yes
  - name: Install pip for python3 with Apt
    apt:
      name: python3-pip
      update_cache: yes
  - name: Install python packages with pip
    pip:
      break_system_packages: true
      name:
        - pint
        - voila
        - notebook==6.5.7
        - jupyterlab==3.6.8
      extra_args: --ignore-installed
  - name: Get disk usage
    shell: df -h
    register: disk_usage
  - name: Display disk usage
    debug:
      msg: "{{ disk_usage.stdout }}"

-
  # Install NodeJS Tools
  hosts: localhost
  connection: local
  gather_facts: yes
  tags:
  - install_node
  - install_doctools

  vars:
    node_version: "20.15.1"
    v_node_version: "v{{ node_version }}"
    npm_version: "10.7.0"
    npx_version: "10.7.0"
    yo_version: "5.0.0"
    generator_code_version: "1.11.1"
    oclif_version: "4.14.6"
    typescript_version: "5.5.3"

  tasks:   # Test Node JS Tools versions
  - name: Get node version
    shell: node --version
    register: installed_node_version
  - name: Get npm version
    shell: npm --version
    register: installed_npm_version
  - name: Get npx installed version
    shell: npx --version
    register: installed_npx_version
  - name: Get oclif version
    shell: oclif --version 2>/dev/null | sed 's/\ /\n/g' | grep oclif | sed 's/\///g' | sed 's/[[:alpha:]|(|[:space:]]//g'
    register: installed_oclif_version
  - name: Get TypeScript Compiler version
    shell: tsc --version | sed 's/[[:alpha:]|(|[:space:]]//g'
    register: installed_tsc_version
  - name: Display node tool versions
    debug:
      msg: "Node = {{ installed_node_version.stdout }} | npm = {{ installed_npm_version.stdout }} | npx = {{ installed_npx_version.stdout }}"
  - name: Display TypeScript Compiler version
    debug:
      msg: "tsc = {{ installed_tsc_version.stdout }}"
  - name: Test node version
    fail:
      msg: "NodeJS Version Error: Expected {{ v_node_version }} | Found {{ installed_node_version.stdout }}"
    when: installed_node_version.stdout != v_node_version
  - name: Test npm version
    fail:
      msg: "NPM Version Error: Expected {{ npm_version }} | Found {{ installed_npm_version.stdout }}"
    when: installed_npm_version.stdout != npm_version
  - name: Test npx version
    fail:
      msg: "NPX Version Error: Expected {{ npx_version }} | Found {{ installed_npx_version.stdout }}"
    when: installed_npx_version.stdout != npx_version
  - name: Test oclif version
    fail:
      msg: "oclif Version Error: Expected {{ oclif_version }} | Found {{ installed_oclif_version.stdout }}"
    when: installed_oclif_version.stdout != oclif_version
  - name: Test TypeScript Compiler version
    fail:
      msg: "TypeScript Compiler Version Error: Expected {{ typescript_version }} | Found {{ installed_tsc_version.stdout }}"
    when: installed_tsc_version.stdout != typescript_version

  roles:
  - role: grzegorznowak.nvm_node
    nvm_install_script_version: "0.39.3"
    nvm_node_version: "{{ node_version }}"
    nvm_install_globally:
    - name: yo
      version: "{{ yo_version }}"
    - name: generator-code
      version: "{{ generator_code_version }}"
    - name: oclif
      version: "{{ oclif_version }}"
    - name: typescript
      version: "{{ typescript_version }}"

-
  # Install Yarn
  hosts: localhost
  connection: local
  gather_facts: yes
  tags:
  - install_yarn

  vars:
    yarn_version: "4.3.1"

  tasks:
  - name: Install Yarn
    shell: "corepack enable && corepack prepare yarn@{{ yarn_version }} --activate"
  - name: Get yarn version
    shell: yarn --version
    register: installed_yarn_version
  - name: Display yarn versions
    debug:
      msg: "yarn = {{ installed_yarn_version.stdout }}"
  - name: Test yarn version
    fail:
      msg: "Yarn Version Error: Expected {{ yarn_version }} | Found {{ installed_yarn_version.stdout }}"
    when: installed_yarn_version.stdout != yarn_version

